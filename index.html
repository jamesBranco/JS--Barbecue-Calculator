<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBQ Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>🍖 BBQ Calculator 🍺</h1>
    </header>

    <main class="container">
        <p>Plan your perfect BBQ with our easy calculator!</p>

        <form id="bbq-form">
            <label for="adults">Number of adults</label>
            <input id="adults" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 10">

            <label for="children">Number of children</label>
            <input id="children" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 4">

            <label for="time">Duration in hours</label>
            <input id="time" type="number" min="0" step="0.5" inputmode="decimal" placeholder="e.g. 5">

            <button type="submit">Calculate</button>
        </form>

        <div id="result" aria-live="polite"></div>
    </main>

    <footer>
        <p>Made with ❤️ for BBQ lovers.</p>
    </footer>

    <script src="script/script.js"></script>
</body>
</html>
